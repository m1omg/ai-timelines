name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only `contents: write` is needed: this publishes by committing the build to the
# gh-pages branch, which is classic Pages. The Pages *deployment* API is deliberately
# not used — creating a Pages site through it needs repo-admin rights that the default
# workflow token does not have, whereas pushing a gh-pages branch enables Pages on its own.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gates as `npm run verify`, minus the ~2 minute Monte Carlo harness —
      # a broken build must not reach the live site, but balance drift is not a deploy
      # blocker. Run `npm run playtest` locally when touching src/engine/sim.ts.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint content
        run: npm run lint:content

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      # .nojekyll stops Jekyll from processing the output and skips its build step.
      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git checkout -qb gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Publish built site from ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
